<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · {{ app_name }}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/docs.css">
    <script>
        try {
            const t = localStorage.getItem("gm-theme");
            const light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.setAttribute("data-theme", t || (light ? "light" : "dark"));
        } catch (e) { /* storage blocked */ }
    </script>
</head>
<body class="docs-body">
    <main class="docs-header">
        <p class="docs-eyebrow" aria-hidden="true">🎸</p>
        <h1>Page not found</h1>
        <p>That page doesn't exist. Head back to the <a href="/">Guitar Mastery AI chat</a> or read the <a href="/docs">API reference</a>.</p>
    </main>
</body>
</html>
